version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: playportal-db
    restart: always
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=playportal
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: playportal-app
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=*
      - MONGODB_URI=mongodb://mongodb:27017/playportal
      - JWT_SECRET=playportal_production_jwt_secret_change_me
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongodb

volumes:
  mongo_data:
