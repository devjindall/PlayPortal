<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" />
  <circle cx="300" cy="200" r="160" fill="url(#glow)" />
  <!-- Space Ship -->
  <polygon points="300,120 240,260 300,230 360,260" fill="#10b981" stroke="#34d399" stroke-width="4" />
  <!-- Asteroids -->
  <circle cx="160" cy="140" r="22" fill="#f43f5e" opacity="0.85" />
  <circle cx="440" cy="170" r="30" fill="#f43f5e" opacity="0.85" />
  <circle cx="210" cy="280" r="18" fill="#f43f5e" opacity="0.7" />
  <!-- Crystals -->
  <polygon points="300,290 315,310 300,330 285,310" fill="#34d399" />
  <!-- Text -->
  <text x="300" y="370" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CYBER DODGER</text>
</svg>
